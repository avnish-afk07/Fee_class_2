<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        .navbar {
            background-color: #333;
        }

        .navbar ul {
            display: flex;
            justify-content: space-around;
            list-style-type: none;
            padding: 0;
            align-items: center;
            
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            font-size: 17px;
        }

        .navbar li:hover {
            background-color: #555;
        }

        button {
            color: white;
            background-color: #333;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        /* .wname{
           
        } */
    </style>
</head>

<body>
    <nav class="navbar">
        <ul>
            <li class="wname"><a href="">Website</a></li>
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
            <li><button>Login</button></li>
        </ul>

    </nav>
</body>

</html>
