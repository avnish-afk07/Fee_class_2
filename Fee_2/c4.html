<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Todo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #64d8ff, #6366f1, #9333ea, #ec4899);
            background-size: 300% 300%;
            animation: bg 12s ease infinite;
        }

        @keyframes bg {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
        }

        body::before {
            background: rgba(255, 255, 255, .35);
            top: -100px;
            left: -100px;
        }

        body::after {
            background: rgba(168, 85, 247, .45);
            right: -100px;
            bottom: -100px;
        }

        #todo {
            width: 480px;
            padding: 30px;
            border-radius: 28px;
            background: rgba(255, 255, 255, .15);
            backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, .2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 25px;
            font-size: 32px;
        }

        .top {
            display: flex;
            gap: 10px;
        }

        .top input {
            flex: 1;
        }

        input {
            padding: 14px 18px;
            border: none;
            border-radius: 15px;
            outline: none;
            background: rgba(255, 255, 255, .18);
            color: white;
            font-size: 16px;
            transition: .3s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, .75);
        }

        input:focus {
            background: rgba(255, 255, 255, .28);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, .15);
        }

        .btn {
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 14px;
            padding: 14px 18px;
            font-weight: 600;
            transition: .3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .add {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
        }

        .edit {
            background: linear-gradient(135deg, #06b6d4, #2563eb);
        }

        .save {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .delete {
            background: linear-gradient(135deg, #ff5f6d, #ff9966);
        }

        .list {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item {
            background: rgba(255, 255, 255, .15);
            border: 1px solid rgba(255, 255, 255, .15);
            backdrop-filter: blur(15px);
            border-radius: 18px;
            padding: 16px;
            transition: .3s;
        }

        .item:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, .22);
        }

        .view-mode,
        .edit-mode {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .edit-mode {
            display: none;
        }

        .item p {
            color: white;
            font-size: 17px;
            flex: 1;
            word-break: break-word;
        }

        .item input {
            flex: 1;
        }

        .actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>

<body>

    <div id="todo"></div>

    <script>
        (function () {

            let todos = JSON.parse(localStorage.getItem("todos")) || [];
            const app = document.getElementById("todo");

            const title = document.createElement("h1");
            title.textContent = "✨ My Tasks";

            const top = document.createElement("div");
            top.className = "top";

            const input = document.createElement("input");
            input.placeholder = "Enter a task...";

            const addBtn = document.createElement("button");
            addBtn.textContent = "Add";
            addBtn.className = "btn add";

            const list = document.createElement("div");
            list.className = "list";

            top.append(input, addBtn);
            app.append(title, top, list);

            function saveTodos() {
                localStorage.setItem("todos", JSON.stringify(todos));
            }

            function renderTask(todo) {

                const item = document.createElement("div");
                item.className = "item";

                // View Mode
                const view = document.createElement("div");
                view.className = "view-mode";

                const text = document.createElement("p");
                text.innerHTML = todo.text;

                const actions = document.createElement("div");
                actions.className = "actions";

                const editBtn = document.createElement("button");
                editBtn.className = "btn edit";
                editBtn.textContent = "Edit";

                const deleteBtn = document.createElement("button");
                deleteBtn.className = "btn delete";
                deleteBtn.textContent = "Delete";

                actions.append(editBtn, deleteBtn);
                view.append(text, actions);

                // Edit Mode
                const editMode = document.createElement("div");
                editMode.className = "edit-mode";

                const editInput = document.createElement("input");
                editInput.value = todo.text;

                const saveBtn = document.createElement("button");
                saveBtn.className = "btn save";
                saveBtn.textContent = "Save";

                editMode.append(editInput, saveBtn);

                item.append(view, editMode);
                list.prepend(item);

                editBtn.onclick = () => {
                    view.style.display = "none";
                    editMode.style.display = "flex";
                    editInput.focus();
                    editInput.select();
                };

                saveBtn.onclick = () => {

                    const value = editInput.value.trim();

                    if (!value)
                        return;

                    todo.text = value;
                    text.innerHTML = value;

                    saveTodos();

                    editMode.style.display = "none";
                    view.style.display = "flex";
                };

                editInput.addEventListener("keydown", e => {
                    if (e.key === "Enter")
                        saveBtn.click();
                });

                deleteBtn.onclick = () => {

                    const index = todos.findIndex(t => t.id === todo.id);

                    if (index !== -1)
                        todos.splice(index, 1);

                    saveTodos();
                    item.remove();
                };
            }

            function addTodo() {

                const task = input.value.trim();

                if (!task)
                    return;

                const todo = {
                    id: Date.now(),
                    text: task
                };

                todos.unshift(todo);
                saveTodos();

                renderTask(todo);

                input.value = "";
                input.focus();
            }

            addBtn.addEventListener("click", addTodo);

            input.addEventListener("keydown", e => {
                if (e.key === "Enter")
                    addTodo();
            });

            todos.forEach(todo => renderTask(todo));

        })();
    </script>

</body>

</html>
